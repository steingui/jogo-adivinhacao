# Added: NetworkPolicy associating backend pods (CKV2_K8S_6)
# Allow-all rules preserve existing pod connectivity behavior.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-network-policy
  namespace: default
  labels:
    app: backend
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {}
  egress:
    - {}
---
# Source: guess-game/templates/backend-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  # Replicas managed by HPA if enabled, else defaults to minReplicas or a fixed value.
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: flask-backend
          image: steingui/jogo-adivinhacao-backend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: "guessing_user"
            - name: POSTGRES_PASSWORD
              value: "guessing_secure_password_123"
            - name: POSTGRES_DB
              value: "guessing_db"
            - name: POSTGRES_HOST
              value: "db"
            - name: POSTGRES_PORT
              value: "5432"
          ports:
            - containerPort: 5000
              name: http-backend
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http-backend
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http-backend
            initialDelaySeconds: 10
            periodSeconds: 5

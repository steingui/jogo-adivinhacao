# Source: guess-game/templates/db-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  labels:
    app: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      volumes:
        - name: pgdata
          emptyDir: {}
        - name: pgrun
          emptyDir: {}
        - name: pgtmp
          emptyDir: {}
      containers:
        - name: postgres
          image: postgres:15-alpine
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: pgrun
              mountPath: /var/run/postgresql
            - name: pgtmp
              mountPath: /tmp
          resources:
            limits:
              cpu: 200m
            requests:
              cpu: 100m
              memory: 128Mi
          env:
            - name: POSTGRES_USER
              value: "guessing_user"
            - name: POSTGRES_PASSWORD
              value: "guessing_secure_password_123"
            - name: POSTGRES_DB
              value: "guessing_db"
          ports:
            - containerPort: 5432
              name: postgres
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - guessing_user
                - -d
                - guessing_db
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - guessing_user
                - -d
                - guessing_db
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: db-pvc
---
